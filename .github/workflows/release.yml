name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build assets for'
        required: true

permissions:
  contents: write

# macOS artifacts are built and signed locally with build/release-macos.sh
# (the signing identity lives on the maintainer's Mac). CI covers Linux
# (cgo + gtk4/webkitgtk-6.0) and Windows (pure Go, icon via go-winres,
# windowsgui subsystem so no console window pops up).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install Linux webview deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Embed Windows icon resource
        if: matrix.goos == 'windows'
        shell: bash
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in build/winres/winres.json
      - name: Build
        shell: bash
        run: |
          ext="" ; cgo=1 ; flags="-s -w"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe" ; cgo=0 ; flags="-s -w -H=windowsgui"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=$cgo \
            go build -trimpath -ldflags="$flags" -o "agent-notify-${{ matrix.goos }}-${{ matrix.goarch }}$ext" .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: agent-notify-${{ matrix.goos }}-${{ matrix.goarch }}*
