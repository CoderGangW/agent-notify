<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>claude-notify</title>
<link rel="stylesheet" href="/style.css"/>
</head>
<body>
<div id="shell">
  <header style="--wails-draggable:drag">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="0.5" y="0.5" width="23" height="23" rx="6.2" fill="#D97757"/>
        <g transform="translate(2.6,2.6) scale(0.783)">
          <path fill="#FFF6EF" d="M12 3.4C8.2 3.4 6.6 6.4 6.5 9.4C6.45 12.4 5.9 14.6 4.6 16.2L19.4 16.2C18.1 14.6 17.55 12.4 17.5 9.4C17.4 6.4 15.8 3.4 12 3.4ZM4.35 16.2L19.65 16.2C20.2 16.2 20.6 16.62 20.6 17.15C20.6 17.68 20.2 18.1 19.65 18.1L4.35 18.1C3.8 18.1 3.4 17.68 3.4 17.15C3.4 16.62 3.8 16.2 4.35 16.2ZM10.45 20.1a1.55 1.55 0 1 0 3.1 0a1.55 1.55 0 1 0 -3.1 0Z"/>
          <g stroke="#D97757" stroke-width="1.62" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M8.78 8.08 11.58 10.6 8.78 13.12"/>
            <path d="M12.98 10.6h2.24"/>
          </g>
        </g>
      </svg>
      <span class="title">claude-notify</span>
      <span class="dot" id="live-dot" title="데몬 연결됨"></span>
    </div>
    <div class="actions" style="--wails-draggable:no-drag">
      <select id="lang-sel" title="Language">
        <option value="auto">Auto</option>
        <option value="en">EN</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
      </select>
      <button id="mute-btn" class="icon-btn" title="알림 끄기/켜기"></button>
      <button id="quit-btn" class="icon-btn" title="종료"></button>
    </div>
  </header>

  <section class="card" id="limits-card">
    <div class="card-head">
      <h2 data-i18n="limits.title">플랜 한도</h2>
      <span class="sub" id="limits-note"></span>
    </div>
    <div id="limits-body" class="gauges"></div>
  </section>

  <section class="card" id="usage-card">
    <div class="card-head">
      <h2 data-i18n="usage.title">토큰 사용량</h2>
      <span class="sub" data-i18n="usage.local">로컬 트랜스크립트 합산</span>
    </div>
    <div class="usage-grid">
      <div class="stat"><span class="num" id="u-today">–</span><span class="lbl" data-i18n="usage.today">오늘</span></div>
      <div class="stat"><span class="num" id="u-week">–</span><span class="lbl" data-i18n="usage.week">최근 7일</span></div>
      <div class="stat"><span class="num" id="u-out">–</span><span class="lbl" data-i18n="usage.out">오늘 출력</span></div>
      <div class="stat"><span class="num" id="u-cache">–</span><span class="lbl" data-i18n="usage.cache">오늘 캐시 읽기</span></div>
    </div>
    <div id="models" class="models"></div>
  </section>

  <section class="card grow" id="events-card">
    <div class="card-head">
      <h2><span data-i18n="events.title">세션 이벤트</span> <span class="badge" id="done-badge"></span></h2>
      <button id="clear-btn" class="text-btn" data-i18n="events.clear">비우기</button>
    </div>
    <ul id="events"></ul>
    <div id="empty" class="empty"><span data-i18n="events.empty">아직 이벤트 없음</span><span data-i18n="events.hint">Claude Code 세션이 끝나면 여기 뜸</span></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
