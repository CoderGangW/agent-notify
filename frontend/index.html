<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>agent-notify</title>
<link rel="stylesheet" href="/style.css"/>
</head>
<body>
<div id="shell">
  <header style="--wails-draggable:drag">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="logo-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8A2BE2"/>
            <stop offset="1" stop-color="#5D0BCB"/>
          </linearGradient>
        </defs>
        <rect x="0.5" y="0.5" width="23" height="23" rx="6.2" fill="url(#logo-bg)"/>
        <g transform="translate(0.72 0.72) scale(0.94)" stroke="#EBDDF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 20.2a1.94 1.94 0 0 0 3.4 0"/>
          <g transform="translate(5.06 3.96) scale(0.52)" stroke-width="3.85">
            <path d="M6.8 8.8 9.8 12 6.8 15.2"/>
            <path d="M16.2 12h4.6"/>
          </g>
        </g>
      </svg>
      <span class="title">agent-notify</span>
      <span class="dot" id="live-dot"></span>
    </div>
    <div class="actions" style="--wails-draggable:no-drag">
      <select id="lang-sel" data-tip="Language">
        <option value="auto">Auto</option>
        <option value="en">EN</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
      </select>
      <button id="mute-btn" class="icon-btn"></button>
      <button id="quit-btn" class="icon-btn"></button>
    </div>
  </header>

  <nav id="tabs">
    <div class="seg">
      <span id="tab-ink"></span>
      <button class="tab" data-tab="claude">Claude<span class="tab-badge" id="badge-claude"></span></button>
      <button class="tab" data-tab="codex">Codex<span class="tab-badge" id="badge-codex"></span></button>
    </div>
    <button id="pin-btn" class="icon-btn" title=""></button>
  </nav>

  <section class="card" id="limits-card">
    <div class="card-head">
      <h2><span data-i18n="limits.title">플랜 한도</span><span class="plan-chip" id="plan-chip"></span></h2>
      <span class="sub" id="limits-note"></span>
    </div>
    <div id="limits-body" class="gauges"></div>
  </section>

  <section class="card" id="usage-card">
    <div class="card-head">
      <h2 data-i18n="usage.title">토큰 사용량</h2>
      <span class="sub" data-i18n="usage.local">로컬 트랜스크립트 합산</span>
    </div>
    <div class="usage-grid">
      <div class="stat"><span class="num" id="u-today">–</span><span class="lbl" data-i18n="usage.today">오늘</span></div>
      <div class="stat"><span class="num" id="u-week">–</span><span class="lbl" data-i18n="usage.week">최근 7일</span></div>
      <div class="stat"><span class="num" id="u-out">–</span><span class="lbl" data-i18n="usage.out">오늘 출력</span></div>
      <div class="stat"><span class="num" id="u-cache">–</span><span class="lbl" data-i18n="usage.cache">오늘 캐시 읽기</span></div>
    </div>
    <div id="models" class="models"></div>
  </section>

  <section class="card grow" id="events-card">
    <div class="card-head">
      <h2><span data-i18n="events.title">세션 이벤트</span> <span class="badge" id="done-badge"></span></h2>
      <span>
        <button id="readall-btn" class="text-btn" data-i18n="events.readAll">모두 읽기</button>
        <button id="clear-btn" class="text-btn" data-i18n="events.clear">비우기</button>
      </span>
    </div>
    <ul id="events"></ul>
    <div id="empty" class="empty"><span data-i18n="events.empty">아직 이벤트 없음</span><span data-i18n="events.hint">Claude Code 세션이 끝나면 여기 뜸</span></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
