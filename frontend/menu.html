<!doctype html>
<html lang="ko" data-theme="{{THEME}}">
<head>
<meta charset="utf-8"/>
<title>agent-notify</title>
<link rel="stylesheet" href="/css/base.css"/>
<style>
  /* self-contained tray context menu */
  html, body { overflow: hidden; }
  #menu {
    /* natural size: JS measures this box and resizes the window to fit */
    width: max-content;
    min-width: 168px;
    display: flex; flex-direction: column;
    padding: 6px;
    gap: 1px;
  }
  .m-head {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 6px 6px;
  }
  .m-head .m-logo { width: 24px; height: 24px; flex-shrink: 0; }
  .m-head .name { font-weight: 700; font-size: 12px; }
  .m-head .ver { color: var(--dim); font-size: 9.5px; margin-top: 1px; }
  .m-sep { height: 1px; background: var(--card-edge); margin: 2px 3px 4px; }
  .m-item {
    display: flex; align-items: center;
    background: none; border: none; cursor: pointer;
    color: var(--text); font-size: 11.5px; text-align: left;
    padding: 6px 8px; border-radius: 7px;
    transition: background 0.12s, color 0.35s, opacity 0.16s;
  }
  /* version picker rows: indented under the item, slightly dimmer */
  #m-verlist { display: flex; flex-direction: column; gap: 1px; }
  .m-verrow { padding-left: 20px; font-size: 11px; color: var(--dim); }
  .m-verrow:disabled { cursor: default; color: var(--text); }
  /* loading spinner while /api/releases answers (a div, not an svg:
     CSS rotation of svg goes off-axis in WebKit) */
  .m-spin {
    width: 12px; height: 12px; margin: 6px 0 6px 20px;
    border: 1.6px solid var(--card-edge); border-top-color: var(--app-accent);
    border-radius: 50%;
    animation: m-spin 0.7s linear infinite;
  }
  @keyframes m-spin { to { transform: rotate(360deg); } }
  /* "up to date": the label lights up in the app purple once, then
     fades back to "check for updates" */
  .m-item.latest { color: var(--app-accent); animation: m-glow 1.1s ease-out; }
  @keyframes m-glow {
    0%   { text-shadow: 0 0 0 transparent; }
    35%  { text-shadow: 0 0 10px var(--app-accent); }
    100% { text-shadow: 0 0 0 transparent; }
  }
  .m-item:hover { background: var(--accent-soft); color: var(--accent); }
  .m-item:disabled { color: var(--dim); cursor: default; background: none; }
  .m-item.danger:hover {
    color: var(--bad);
    background: color-mix(in srgb, var(--bad) 12%, transparent);
  }
</style>
</head>
<body>
<div id="menu">
  <div class="m-head">
    <img class="m-logo" src="/logo.svg" alt="" draggable="false"/>
    <div>
      <div class="name">agent-notify</div>
      <div class="ver" id="m-ver">{{L_VERSION}}</div>
    </div>
  </div>
  <div class="m-sep"></div>
  <!-- static defaults keep the menu usable before /api/state answers -->
  <button class="m-item" id="m-upd">{{L_UPDATE}}</button>
  <button class="m-item" id="m-vers">{{L_VERSIONS}}</button>
  <div id="m-verlist" hidden></div>
  <button class="m-item" id="m-restart">{{L_RESTART}}</button>
  <div class="m-sep"></div>
  <button class="m-item danger" id="m-quit">{{L_QUIT}}</button>
</div>
<script src="/js/shape.js"></script>
<script>
"use strict";
// see js/core.js: no Wails runtime here, so announce ready for ExecJS
(window.webkit?.messageHandlers?.external || window.chrome?.webview)?.postMessage("wails:runtime:ready");
// tiny standalone i18n: the menu window doesn't share the dashboard's JS
let mdict = {};
const mt = (k) => mdict[k] || k;
const $id = (id) => document.getElementById(id);

// mirror the dashboard's theme resolution (config value + OS preference)
function applyMenuTheme(themeSetting) {
  const th = themeSetting || "auto";
  const light =
    th === "light" ||
    (th !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.theme = light ? "light" : "dark";
}

let updState = "idle"; // idle | checking | available | applying
let updLatest = "";

function setUpd(state, label) {
  updState = state;
  const b = $id("m-upd");
  b.textContent = label;
  b.disabled = state === "checking" || state === "applying";
  b.classList.toggle("latest", state === "latest");
}

async function loadMenu() {
  try {
    const st = await (await fetch("/api/state")).json();
    applyMenuTheme(st.settings && st.settings.theme);
    mdict = await (await fetch("/i18n/" + (st.lang || "en") + ".json")).json();
    $id("m-ver").textContent = mt("menu.version").replace("%s", "v" + st.version);
    $id("m-vers").textContent = mt("menu.versions");
    $id("m-restart").textContent = mt("tip.restart");
    $id("m-quit").textContent = mt("tip.quit");
    if (st.updateAvail) {
      updLatest = st.updateAvail;
      setUpd("available", mt("update.available").replace("{v}", st.updateAvail));
    } else if (updState === "idle") {
      setUpd("idle", mt("update.check"));
    }
  } catch (_) {}
}

$id("m-upd").addEventListener("click", async () => {
  if (updState === "available") {
    setUpd("applying", mt("update.applying"));
    try {
      const r = await (await fetch("/api/update-apply", { method: "POST" })).json();
      if (!r.ok) throw new Error();
      // daemon restarts on success; nothing more to do here
    } catch (_) {
      setUpd("idle", mt("update.fail"));
    }
    return;
  }
  setUpd("checking", mt("update.checking"));
  try {
    const r = await (await fetch("/api/update-check", { method: "POST" })).json();
    if (r.available) {
      updLatest = r.latest;
      setUpd("available", mt("update.available").replace("{v}", r.latest));
    } else {
      setUpd("latest", mt("update.latest"));
      setTimeout(() => {
        if (updState !== "latest") return;
        const b = $id("m-upd");
        b.style.opacity = "0"; // fade out, swap the label, fade back in
        setTimeout(() => {
          b.style.opacity = "";
          setUpd("idle", mt("update.check"));
        }, 160);
      }, 2200);
    }
  } catch (_) {
    setUpd("idle", mt("update.fail"));
  }
});
// version picker: expands under the item; any listed version installs via
// the same verified pipeline as an update (downgrades included)
$id("m-vers").addEventListener("click", async () => {
  const list = $id("m-verlist");
  if (!list.hidden) {
    list.hidden = true;
    fitWindow();
    return;
  }
  list.innerHTML = '<div class="m-spin"></div>';
  list.hidden = false;
  fitWindow();
  try {
    const r = await (await fetch("/api/releases")).json();
    list.textContent = "";
    for (const v of r.versions) {
      const b = document.createElement("button");
      b.className = "m-item m-verrow";
      b.textContent = (v.current ? "✓ " : "") + "v" + v.version;
      b.disabled = v.current;
      b.addEventListener("click", async () => {
        b.textContent = mt("update.applying");
        for (const x of list.children) x.disabled = true;
        try {
          const res = await (await fetch("/api/update-apply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ version: v.version }),
          })).json();
          if (!res.ok) throw new Error();
          // daemon restarts on success
        } catch (_) {
          b.textContent = mt("update.fail");
        }
      });
      list.appendChild(b);
    }
  } catch (_) {
    list.textContent = mt("update.fail");
  }
  fitWindow();
});
$id("m-restart").addEventListener("click", () => {
  fetch("/api/restart", { method: "POST" }).catch(() => {});
});
$id("m-quit").addEventListener("click", () => {
  fetch("/api/quit", { method: "POST" }).catch(() => {});
});

// fit the window to the rendered content (labels differ per language)
function fitWindow() {
  // right/bottom, not width/height: on macOS the box sits below the dome
  // strip (body padding-top from shape.js), which the window must include
  const r = $id("menu").getBoundingClientRect();
  fetch("/api/menu-size", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ w: Math.ceil(r.right), h: Math.ceil(r.bottom) }),
  }).catch(() => {});
}

fitWindow();
loadMenu().then(fitWindow);
// re-sync every time the window is summoned again
window.addEventListener("focus", () => loadMenu().then(fitWindow));
</script>
</body>
</html>
